         async function callAI(prompt, systemInstruction = "") {
             if (!apiKey) {
                 setTimeout(openApiKeyModal, 500);
                 return "请先点击【API 设置】配置 Key，才能使用 AI 医生哦~";
             }
             const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
             try {
                 const response = await fetch(url, {
                     method: 'POST',
                     headers: { 'Content-Type': 'application/json' },
                     body: JSON.stringify({
                         contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { thinkingConfig: { thinkingLevel: "low" } },
                         systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined
                     })
                 });
                 const data = await response.json();
                if (data.error) {
                    console.error("AI Error:", data.error);
                    if (data.error.code === 429) {
                        return "⚠️ 您的免费 API 调用额度已耗尽，请稍后重试，或点击右上角切换为 gemini-2.0-flash 模型。";
                    }
                    return `API 错误: ${data.error.message || '未知错误'}`;
                }
                 return data.candidates?.[0]?.content?.parts?.[0]?.text || "抱歉，我现在有点忙，请稍后再试。";
             } catch (e) {
                 return "连接 AI 失败，请检查网络或 Key 是否有效。";
             }
         }
         
         async function callAIWithParts(parts, systemInstruction = "") {
             if (!apiKey) {
                 setTimeout(openApiKeyModal, 500);
                 return "请先配置 API Key 才能看懂照片哦~";
             }
             const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${apiKey}`;
             try {
                 const response = await fetch(url, {
                     method: 'POST',
                     headers: { 'Content-Type': 'application/json' },
                     body: JSON.stringify({
                        contents: [{ parts }],
                        systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined
                    })
                 });
                 const data = await response.json();
                 if (data.error) {
                     console.error("AI Error:", data.error);
                     return `API 错误: ${data.error.message || '未知错误'}`;
                 }
                 return data.candidates?.[0]?.content?.parts?.[0]?.text || "抱歉，我现在有点忙，请稍后再试。";
             } catch (e) {
                 return "连接 AI 失败，请检查网络或 Key 是否有效。";
             }
         }

        function handleImageSelected(e) {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            sendImage(file);
            e.target.value = '';
        }
        
        function readImage(file) {
            return new Promise((resolve, reject) => {
                const fr = new FileReader();
                fr.onload = () => {
                    const dataUrl = String(fr.result || '');
                    const idx = dataUrl.indexOf(',');
                    const base64 = idx >= 0 ? dataUrl.slice(idx + 1) : '';
                    resolve({ base64, dataUrl, mime: file.type || 'image/jpeg' });
                };
                fr.onerror = reject;
                fr.readAsDataURL(file);
            });
        }
        
        async function sendImage(file) {
            const input = document.getElementById('chat-input');
            const desc = input ? input.value.trim() : '';
            const img = await readImage(file);
            chatMessages.push({ role: 'user', image: img.dataUrl, text: desc });
            renderAskTab();
            if (input) input.value = '';
            chatMessages.push({ role: 'assistant', text: '<span class="loading-dots">AI 正在深度分析中</span>' });
            renderAskTab();
            const parts = [];
            if (desc) parts.push({ text: desc });
            parts.push({ inline_data: { mime_type: img.mime, data: img.base64 } });
            const sysPrompt = '你是一位宠物医生。请根据上传照片和描述提供：1. 可能病因 2. 护理建议 3. 就医预警。';
            const ai = await callAIWithParts(parts, sysPrompt);
            chatMessages.pop();
            chatMessages.push({ role: 'assistant', text: ai });
            renderAskTab();
        }

                .replace(/^### (.*$)/gim, '<h4>$1</h4>')

        function confirmShopPay(pid) {
            const bridge = window.cccBridge;
            const p = shopProducts.find(x => x.id === pid);
            if (!p) return;
            closeModal();
            openModal(`
                <div class="flex flex-col items-center justify-center py-10">
                    <div class="loading-dots text-[#2ECC71] font-bold text-xl mb-2"></div>
                    <p class="text-xs text-[#5D4037]">正在支付...</p>
                </div>
            `);
            (async () => {
                try {
                    if (!bridge || !await bridge.getAddress()) {
                        await bridge.open();
                    }
                    const to = await bridge.getAddress();
                    const hash = await bridge.payCkb(p.price, to);
                    closeModal();
                    const toast = document.createElement('div');
                    toast.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white px-4 py-2 rounded-full text-sm z-[200] animate-fade';
                    toast.innerText = `✅ 支付成功，交易哈希: ${String(hash).slice(0,10)}...`;
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 2500);
                } catch (e) {
                    closeModal();
                    const toast = document.createElement('div');
                    toast.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white px-4 py-2 rounded-full text-sm z-[200] animate-fade';
                    toast.innerText = '❌ 支付失败，请检查钱包余额或网络';
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 2500);
                }
            })();
        }

            const status = walletConnected ? '已连接' : '未连接';

            openModal(`

                            </div>
                        </div>
                    ` : `
                        <div class="grid grid-cols-2 gap-2">
                            ${providers.map(p => `

                            `).join('')}
                        </div>
                    `}
                </div>
            `);
            lucide.createIcons();
        }
        
        function connectWallet(p) {
            walletProvider = p;
            walletAddress = '0x' + Array.from(crypto.getRandomValues(new Uint8Array(20))).map(b => b.toString(16).padStart(2,'0')).join('');
            walletConnected = true;
            closeModal();
            openWalletModal();
        }
        
        function disconnectWallet() {
            walletConnected = false;
            walletProvider = '';
            walletAddress = '';
            closeModal();
            openWalletModal();
        }
        
        function copyWalletAddress() {
            if (!walletAddress) return;
            navigator.clipboard.writeText(walletAddress).then(() => {
                const toast = document.createElement('div');
                toast.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white px-4 py-2 rounded-full text-sm z-[200] animate-fade';
                toast.innerText = '📋 已复制钱包地址';
                document.body.appendChild(toast);
                setTimeout(() => toast.remove(), 1500);
            });
        }

        function switchPet(id) {
            currentPetId = id;

            renderMeTab();
            // 同时更新其他tab的数据上下文
            // 比如刷新问诊页的欢迎语等（如果当前在问诊页，但这里是在'Me'页切换，所以下次进问诊页会自动刷新）
        }

        function openAddPetModal() {
            openModal(`
                <div class="space-y-4">
                    <h3 class="font-bold text-lg text-[#5D4037]">添加新宠物</h3>
                    <div class="space-y-3">
                        <input id="pet-name" placeholder="宠物昵称" class="w-full bg-[#FFF9F5] p-3 rounded-xl text-sm border border-[#F1E0D6]">

                            <select id="pet-species" class="flex-1 bg-[#FFF9F5] p-3 rounded-xl text-sm border border-[#F1E0D6]">

                            </select>
                        </div>
                        <input id="pet-breed" placeholder="品种 (如: 英短)" class="w-full bg-[#FFF9F5] p-3 rounded-xl text-sm border border-[#F1E0D6]">

                    </div>
                    <button onclick="savePet()" class="w-full bg-[#D2B48C] text-white py-3 rounded-xl font-bold">保存档案</button>
                </div>
            `);
        }

        function openEditPetModal(id) {
            const p = pets.find(x => x.id === id);
            openModal(`
                <div class="space-y-4">
                    <h3 class="font-bold text-lg text-[#5D4037]">编辑档案</h3>
                    <div class="space-y-3">
                        <input id="pet-name" value="${p.name}" class="w-full bg-[#FFF9F5] p-3 rounded-xl text-sm border border-[#F1E0D6]">
                        <div class="flex gap-2">
                            <select id="pet-species" class="flex-1 bg-[#FFF9F5] p-3 rounded-xl text-sm border border-[#F1E0D6]">
                                <option value="猫" ${p.species === '猫' ? 'selected' : ''}>猫</option>
                                <option value="狗" ${p.species === '狗' ? 'selected' : ''}>狗</option>
                            </select>
                            <select id="pet-gender" class="flex-1 bg-[#FFF9F5] p-3 rounded-xl text-sm border border-[#F1E0D6]">
                                <option value="弟弟" ${p.gender === '弟弟' ? 'selected' : ''}>弟弟</option>
                                <option value="妹妹" ${p.gender === '妹妹' ? 'selected' : ''}>妹妹</option>
                            </select>
                        </div>
                        <input id="pet-breed" value="${p.breed}" class="w-full bg-[#FFF9F5] p-3 rounded-xl text-sm border border-[#F1E0D6]">
                        <input id="pet-age" value="${p.age}" class="w-full bg-[#FFF9F5] p-3 rounded-xl text-sm border border-[#F1E0D6]">
                        <input id="pet-weight" value="${p.weight}" type="number" class="w-full bg-[#FFF9F5] p-3 rounded-xl text-sm border border-[#F1E0D6]">
                    </div>
                    <button onclick="savePet(${id})" class="w-full bg-[#D2B48C] text-white py-3 rounded-xl font-bold">更新档案</button>
                </div>
            `);
        }

        function savePet(editId = null) {
            const name = document.getElementById('pet-name').value;
            const species = document.getElementById('pet-species').value;
            const breed = document.getElementById('pet-breed').value;
            const age = document.getElementById('pet-age').value;
            const weight = parseFloat(document.getElementById('pet-weight').value) || 0;
            const gender = document.getElementById('pet-gender').value;
            
            if (!name) return alert('请输入昵称');

            if (editId) {
                const p = pets.find(x => x.id === editId);
                Object.assign(p, { name, species, breed, age, weight, gender, avatar: species === '猫' ? '🐱' : '🐶' });
            } else {
                pets.push({
                    id: Date.now(),
                    name, species, breed, age, weight, gender,
                    avatar: species === '猫' ? '🐱' : '🐶'
                });
            }
            closeModal();
            renderMeTab();
        }

        // 工具逻辑
        function openTool(type) {
            if (type === 'age') {
                openModal(`
                    <div class="text-center space-y-4">
                        <h3 class="font-bold text-lg text-[#5D4037]">宠物年龄换算</h3>
                        <p class="text-xs text-[#A1887F]">宠物 1 岁 ≈ 人类 15-18 岁</p>
                        <div class="bg-[#FFF9F5] p-4 rounded-2xl border border-[#F1E0D6]">
                            <label class="block text-xs font-bold text-[#A1887F] mb-2">输入宠物年龄 (岁)</label>
                            <input type="number" id="calc-age-input" class="w-20 text-center p-2 rounded-lg border border-[#F1E0D6] mb-4" oninput="calculateHumanAge(this.value)">
                            <div class="text-3xl font-bold text-[#D2B48C]" id="calc-age-result">--</div>
                            <div class="text-xs text-[#A1887F]">人类年龄</div>
                        </div>
                    </div>
                `);
            } else if (type === 'food') {
                openModal(`
                    <div class="h-[60vh] flex flex-col">
                        <h3 class="font-bold text-lg text-[#5D4037] mb-3">食物禁忌查询</h3>
                        <input type="text" placeholder="输入食物名称 (如: 葡萄)" class="w-full p-3 rounded-xl border border-[#F1E0D6] mb-3 bg-[#FFF9F5]" oninput="searchFood(this.value)">
                        <div id="food-results" class="flex-1 overflow-y-auto space-y-2"></div>
                    </div>
                `);
                setTimeout(() => searchFood(''), 0);
            } else if (type === 'calc') {
                openModal(`
                    <div class="space-y-4">
                        <h3 class="font-bold text-lg text-[#5D4037]">每日喂食计算器</h3>
                        <div class="space-y-3">
                            <div>
                                <label class="text-xs font-bold text-[#A1887F]">宠物体重 (kg)</label>
                                <input type="number" id="calc-weight" value="${petInfo.weight}" class="w-full p-2 border border-[#F1E0D6] rounded-lg bg-[#FFF9F5]">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-[#A1887F]">活动量</label>
                                <select id="calc-activity" class="w-full p-2 border border-[#F1E0D6] rounded-lg bg-[#FFF9F5]">
                                    <option value="1.2">低 (室内少动)</option>
                                    <option value="1.4">中 (每日散步)</option>
                                    <option value="1.6">高 (经常奔跑)</option>
                                </select>
                            </div>
                            <button onclick="calculateFood()" class="w-full bg-[#D2B48C] text-white py-2 rounded-xl font-bold">开始计算</button>
                            <div id="calc-food-result" class="hidden p-4 bg-[#FFF9F5] rounded-xl border border-[#F1E0D6] text-center">
                                <span class="text-xs text-[#A1887F]">每日建议热量</span>
                                <div class="text-2xl font-bold text-[#5D4037] my-1"><span id="cal-val"></span> kcal</div>
                            </div>
                        </div>
                    </div>
                `);
            }
        }

        function calculateHumanAge(age) {
            const val = parseFloat(age);
            if (!val) return;
            // 简单估算公式
            let human = val <= 1 ? val * 15 : 15 + 9 + (val - 2) * 4;
            document.getElementById('calc-age-result').innerText = Math.round(human);
        }

        function searchFood(query) {
            const list = document.getElementById('food-results');
            const speciesKey = petInfo.species === '猫' ? 'cat' : 'dog';
            const q = (query || '').trim();
            if (!q) {
                const defaults = foodTabooData.filter(i => i.species === 'all' || i.species === speciesKey);
                list.innerHTML = defaults.map(renderFoodItem).join('');
                return;
            }
            const res = foodTabooData.filter(i => {
                const hay = [i.name, i.hazard, i.risk, ...(i.aliases || []), ...(i.examples || [])].join(' ');
                return hay.includes(q);
            });
            list.innerHTML = res.length ? res.map(renderFoodItem).join('') : '<div class="text-center text-xs text-gray-400 mt-4">暂无收录</div>';
        }
        
        function severityClass(s) {
            if (s === '危险') return 'bg-red-50 text-red-600 border-red-100';
            if (s === '慎用') return 'bg-yellow-50 text-yellow-600 border-yellow-100';
            return 'bg-green-50 text-green-600 border-green-100';
        }
        
        function renderFoodItem(i) {
            const speciesKey = i.species === 'all' ? '通用' : (i.species === 'cat' ? '猫' : '狗');
            return `
                <div class="p-3 rounded-xl text-xs font-bold border ${severityClass(i.severity)}">
                    <div class="flex justify-between items-center">
                        <span>${i.name}</span>
                        <span class="text-[9px] px-1.5 py-0.5 rounded bg-white/50">${i.severity}</span>
                    </div>
                    <div class="mt-1 text-[10px] font-normal opacity-80">适用：${speciesKey}</div>
                    ${i.risk ? `<div class="mt-1 text-[10px] font-normal">风险成分：${i.risk}</div>` : ''}
                    ${i.hazard ? `<div class="mt-1 text-[10px] font-normal">危害：${i.hazard}</div>` : ''}
                    ${i.examples && i.examples.length ? `<div class="mt-1 text-[10px] font-normal">示例：${i.examples.join('、')}</div>` : ''}
                </div>
            `;
        }

        function calculateFood() {
            const w = parseFloat(document.getElementById('calc-weight').value);
            const factor = parseFloat(document.getElementById('calc-activity').value);
            if (!w) return;
            const rer = 70 * Math.pow(w, 0.75);
            const mer = rer * factor;
            document.getElementById('cal-val').innerText = Math.round(mer);
            document.getElementById('calc-food-result').classList.remove('hidden');
        }

        // 医院与在线问诊
        function openHospitalList() {
            const hospitals = [
                { id: 1, name: "爱心宠物总院", dist: "0.8km", score: 4.9, tags: ["24h急诊", "猫科专科"] },
                { id: 2, name: "瑞鹏宠物医院", dist: "1.5km", score: 4.8, tags: ["疫苗定点", "骨科"] },
                { id: 3, name: "芭比堂动物医院", dist: "2.2km", score: 4.7, tags: ["中兽医", "洗护"] }
            ];
            openModal(`
                <div class="h-[60vh] flex flex-col">
                    <h3 class="font-bold text-lg text-[#5D4037] mb-4">周边医院预约</h3>
                    <div class="flex-1 overflow-y-auto space-y-3">
                        ${hospitals.map(h => `
                            <div class="bg-white border border-[#F1E0D6] p-3 rounded-2xl flex justify-between items-center shadow-sm">

                                    <h4 class="font-bold text-sm text-[#5D4037]">${h.name}</h4>

                                        ${h.tags.map(t => `<span class="text-[9px] bg-gray-100 text-gray-500 px-1 rounded">${t}</span>`).join('')}
                                    </div>
                                </div>
                                <button onclick="openAppointment('${h.name}')" class="bg-[#D2B48C] text-white text-xs px-3 py-1.5 rounded-lg font-bold">预约</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `);
        }

        function openAppointment(hName) {
            openModal(`
                <div class="space-y-4">
                    <h3 class="font-bold text-lg text-[#5D4037]">预约 - ${hName}</h3>
                    <div class="space-y-3">
                        <div>
                            <label class="text-xs font-bold text-[#A1887F]">到店时间</label>
                            <input type="datetime-local" class="w-full p-2 border border-[#F1E0D6] rounded-lg bg-[#FFF9F5] mt-1">
                        </div>
                        <div>
                            <label class="text-xs font-bold text-[#A1887F]">预约项目</label>
                            <div class="grid grid-cols-2 gap-2 mt-1">
                                <label class="flex items-center gap-2 p-2 border border-[#F1E0D6] rounded-lg"><input type="radio" name="srv" checked> <span>疫苗接种</span></label>
                                <label class="flex items-center gap-2 p-2 border border-[#F1E0D6] rounded-lg"><input type="radio" name="srv"> <span>常规体检</span></label>
                                <label class="flex items-center gap-2 p-2 border border-[#F1E0D6] rounded-lg"><input type="radio" name="srv"> <span>绝育咨询</span></label>
                                <label class="flex items-center gap-2 p-2 border border-[#F1E0D6] rounded-lg"><input type="radio" name="srv"> <span>洗护美容</span></label>
                            </div>
                        </div>
                    </div>
                    <button onclick="confirmAppointment()" class="w-full bg-[#D2B48C] text-white py-3 rounded-xl font-bold mt-2">确认预约</button>
                </div>
            `);
        }

        function confirmAppointment() {
            closeModal();
            // 简单Toast模拟
            const toast = document.createElement('div');
            toast.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white px-4 py-2 rounded-full text-sm z-[200] animate-fade';
            toast.innerText = '✅ 预约成功！医院会尽快联系您确认。';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function openOnlineVet() {
            openModal(`
                <div class="text-center py-6 space-y-4">
                    <div class="w-16 h-16 bg-[#D2B48C] rounded-full mx-auto flex items-center justify-center text-white text-2xl">👨‍⚕️</div>
                    <div>
                        <h3 class="font-bold text-lg text-[#5D4037]">在线专家问诊</h3>
                        <p class="text-xs text-[#A1887F] mt-1">当前排队人数: 0 人</p>
                    </div>
                    <div class="bg-[#FFF9F5] p-4 rounded-xl border border-[#F1E0D6] text-left mx-4">
                        <div class="flex justify-between text-sm mb-2"><span>问诊费</span> <span>80 CKB</span></div>
                        <div class="flex justify-between text-sm font-bold text-[#5D4037]"><span>合计</span> <span>80 CKB</span></div>
                    </div>
                    <button onclick="payAndStartConsultation()" class="w-11/12 bg-[#2ECC71] text-white py-3 rounded-xl font-bold shadow-lg shadow-green-200">立即支付并咨询</button>
                </div>
            `);
        }

        function payAndStartConsultation() {
            const bridge = window.cccBridge;
            closeModal();
            openModal(`
                <div class="flex flex-col items-center justify-center py-10">
                    <div class="loading-dots text-[#2ECC71] font-bold text-xl mb-2"></div>
                    <p class="text-xs text-[#5D4037]">正在安全支付...</p>
                </div>
            `);
            (async () => {
                try {
                    if (!bridge || !await bridge.getAddress()) {
                        await bridge.open();
                    }
                    const to = await bridge.getAddress();
                    const hash = await bridge.payCkb(80, to);
                    openVetChat();
                    const history = document.getElementById('vet-chat-history');
                    if (history) {
                        history.innerHTML = `<div class="text-center text-[10px] text-gray-400 my-2">- 支付成功，交易哈希: ${String(hash).slice(0,10)}... 问诊开始 -</div>` + history.innerHTML;
                    }
                } catch (e) {
                    closeModal();
                    const toast = document.createElement('div');
                    toast.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 bg-black/70 text-white px-4 py-2 rounded-full text-sm z-[200] animate-fade';
                    toast.innerText = '❌ 支付失败，请检查钱包余额或网络';
                    document.body.appendChild(toast);
                    setTimeout(() => toast.remove(), 2500);
                }
            })();
        }

        function openVetChat() {
            // 全屏模拟聊天界面
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            
            // 覆盖整个Modal样式以模拟全屏聊天
            content.innerHTML = `
                <div class="flex flex-col h-[80vh]">
                    <div class="flex items-center justify-between border-b border-[#F1E0D6] pb-3 mb-2">
                        <div class="flex items-center gap-2">
                            <div class="w-8 h-8 bg-[#D2B48C] rounded-full flex items-center justify-center text-white text-xs">👨‍⚕️</div>
                            <div>
                                <h4 class="font-bold text-sm text-[#5D4037]">王医生 (执业兽医)</h4>
                                <p class="text-[9px] text-green-500">● 在线中</p>
                            </div>
                        </div>
                        <button onclick="closeModal()" class="text-gray-400"><i data-lucide="x" class="w-5 h-5"></i></button>
                    </div>
                    <div id="vet-chat-history" class="flex-1 overflow-y-auto space-y-3 p-2 bg-[#FFF9F5] rounded-xl mb-3 border border-[#F1E0D6]">
                        <div class="text-center text-[10px] text-gray-400 my-2">- 支付成功，问诊开始 -</div>
                        <div class="flex justify-start">
                            <div class="bg-white p-2 rounded-xl text-xs text-[#5D4037] border border-[#F1E0D6] shadow-sm max-w-[85%]">
                                您好，我是王医生。请问宝贝出现了什么症状？可以发照片或描述一下。
                            </div>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <input id="vet-input" type="text" placeholder="输入消息..." class="flex-1 bg-gray-50 rounded-xl px-3 text-xs outline-none border border-transparent focus:border-[#D2B48C]">
                        <button onclick="sendVetMessage()" class="bg-[#D2B48C] text-white p-2 rounded-xl"><i data-lucide="send" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function sendVetMessage() {
            const input = document.getElementById('vet-input');
            const val = input.value.trim();
            if(!val) return;
            
            const history = document.getElementById('vet-chat-history');
            history.innerHTML += `
                <div class="flex justify-end animate-fade">
                    <div class="bg-[#D2B48C] text-white p-2 rounded-xl text-xs shadow-sm max-w-[85%]">${val}</div>
                </div>
            `;
            input.value = '';
            history.scrollTop = history.scrollHeight;

            // 简单模拟回复
            setTimeout(() => {
                history.innerHTML += `
                    <div class="flex justify-start animate-fade">
                        <div class="bg-white p-2 rounded-xl text-xs text-[#5D4037] border border-[#F1E0D6] shadow-sm max-w-[85%]">
                            收到。这种情况持续多久了？建议先观察一下精神状态。
                        </div>
                    </div>
                `;
                history.scrollTop = history.scrollHeight;
            }, 1000);
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('text-[#D2B48C]'));
            document.getElementById(`btn-${tab}`).classList.add('text-[#D2B48C]');
            const titleEl = document.getElementById('page-title');
            if (titleEl) {
                titleEl.innerText = tab === 'ask' ? '问诊'
                    : tab === 'health' ? '健康'
                    : tab === 'knowledge' ? '科普'
                    : tab === 'shop' ? '商城'
                    : '我的';
            }
            if (tab === 'ask') renderAskTab();
            else if (tab === 'health') renderHealthTab();
            else if (tab === 'knowledge') renderKnowledgeTab();
            else if (tab === 'shop') renderShopTab();
            else if (tab === 'me') renderMeTab();
            lucide.createIcons();
        }

        function openModal(html) {
            const modal = document.getElementById('modal');
            const content = document.getElementById('modal-content');
            content.innerHTML = html + `<button onclick="closeModal()" class="absolute top-4 right-4 p-2 hover:bg-gray-100 rounded-full transition-colors"><i data-lucide="x" class="w-5 h-5 text-gray-400"></i></button>`;
            modal.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() { document.getElementById('modal').classList.add('hidden'); }

        function initChart() {
            const canvas = document.getElementById('weightChart');
            if(!canvas) return;
            new Chart(canvas.getContext('2d'), {
                type: 'line',
                data: {
                    labels: weightHistory.map(w => w.date.split('-').slice(1).join('/')),
                    datasets: [{ 
                        data: weightHistory.map(w => w.weight), 
                        borderColor: '#D2B48C', 
                        borderWidth: 3,
                        pointBackgroundColor: '#FFF',
                        pointBorderColor: '#D2B48C',
                        tension: 0.4, 
                        fill: true, 
                        backgroundColor: 'rgba(210,180,140,0.1)' 
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { grid: { display: false }, ticks: { font: { size: 10 } } },
                        x: { grid: { display: false }, ticks: { font: { size: 10 } } }
                    }
                }
            });
        }
        
        // 保障内联事件在所有环境下可用
        window.openWalletModal = openWalletModal;
        window.connectWallet = connectWallet;
        window.disconnectWallet = disconnectWallet;
        window.copyWalletAddress = copyWalletAddress;
    </script>
</body>
